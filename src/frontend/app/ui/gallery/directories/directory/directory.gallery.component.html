<a class="button btn btn-secondary"
  [routerLink]="['/gallery', getDirectoryPath()]"
  [queryParams]="queryService.getParams()"
  style="display: inline-block;">


  <div class="photo-container rounded overflow-hidden"
    [style.width.px]="size()"
    [style.height.px]="size()">
    @if (thumbnail && thumbnail.Available) {
      <div class="photo"
      [style.background-image]="getSanitizedThUrl()"></div>
    }

    @if (!thumbnail || !thumbnail.Available) {
      <app-icon class="no-image" />
    }
  </div>
  <!--Info box -->
  <div class="info rounded-bottom">
    <div class="directory-name">{{directory().name}}</div>

  </div>
</a>
@if (canEdit) {
  <button type="button" class="edit-button" (click)="rename($event)"
          title="Rename folder" i18n-title aria-label="Rename folder" i18n-aria-label>
    <ng-icon name="ionPencil" />
  </button>
}
